<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Offline · SmartSave</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-size: 1.25rem; margin: 20px 0 8px; }
        p { color: #64748b; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
        a { display: inline-block; background: #059669; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; }
        @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } p { color: #94a3b8; } }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>SmartSave needs an internet connection to show your up-to-date savings. Nothing is stored on this device.</p>
    <a href="/dashboard">Try again</a>
</main>
</body>
</html>
