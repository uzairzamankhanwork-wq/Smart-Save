services:
  - type: web
    name: smartsave-demo
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SMARTSAVE_MAX_USERS
        value: "3"
      - key: SMARTSAVE_BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: SMARTSAVE_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SMARTSAVE_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: warning
